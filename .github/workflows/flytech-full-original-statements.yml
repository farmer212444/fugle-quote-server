name: V8.10.8 6206 complete quarterly PDF intake CI
on:
  pull_request:
    paths:
      - '.github/workflows/flytech-full-original-statements.yml'
      - '.github/workflows/tw_v877_research_rank.yml'
      - 'scripts/flytech_full_original_statements.py'
      - 'tests/test_flytech_full_original_statements.py'
      - 'scripts/v8108_focus_aplus_repair.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source PDF reader
        run: python -m pip install pymupdf
      - name: Validate link discovery, source identity and immutable SHA
        env:
          PYTHONPATH: '.'
        run: |
          python -m py_compile scripts/flytech_full_original_statements.py
          python -m unittest -v tests.test_flytech_full_original_statements
      - name: Live issuer directory smoke, never registered as a quality PASS
        if: github.event_name == 'workflow_dispatch'
        env:
          PYTHONPATH: '.'
        run: |
          python scripts/flytech_full_original_statements.py --data-root "$RUNNER_TEMP/flytech-source-smoke" --last 2026-Q2 --max-new 1 --max-twse-probes 1
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'flytech-source-smoke/rankings/6206_full_original_statements_progress.json'
          j=json.loads(p.read_text())
          assert j['formal_Aplus'] is False and j['formal_gate_passes_issued']==0
          assert 0<=j['original_full_statements_archived']<=8
          assert j['original_full_statements_archived']+len(j['original_quarters_missing'])==8
          print('FULL_STATEMENT_SOURCE_DIAGNOSIS',
                dict(found_links=j['source_period_links_discovered'],
                     archived=j['original_full_statements_archived'],
                     errors=j['collection_errors'][:8]))
          PY
