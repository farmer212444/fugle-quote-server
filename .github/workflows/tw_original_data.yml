name: Taiwan Official Revenue Capture
on:
  workflow_dispatch:
  schedule:
    - cron: '20 10 * * 1-5'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch official revenue files
        shell: bash
        run: |
          mkdir -p raw
          python3 - <<'PY'
          import csv, datetime, hashlib, io, json, pathlib, urllib.request
          sources = [
              ('twse', 'https://openapi.twse.com.tw/v1/opendata/t187ap05_L', 'json'),
              ('tpex', 'https://mopsfin.twse.com.tw/opendata/t187ap05_O.csv', 'csv'),
              ('tpex_backup', 'https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap05_O', 'json'),
          ]
          reports = []
          for name, url, kind in sources:
              item = {'name': name, 'url': url, 'status': 'FAILED'}
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      data = response.read(15000001)
                  if not 500 < len(data) <= 15000000 or b'<html' in data[:300].lower():
                      raise ValueError('Empty, oversized or HTML error response')
                  if kind == 'json':
                      rows = json.loads(data.decode('utf-8-sig'))
                      if not isinstance(rows, list) or len(rows) < 50:
                          raise ValueError('Not an issuer data array')
                  else:
                      try:
                          content = data.decode('utf-8-sig')
                      except UnicodeDecodeError:
                          content = data.decode('cp950')
                      if '公司代號' not in content[:4000] and '公司代碼' not in content[:4000]:
                          raise ValueError('Missing company-code heading')
                  pathlib.Path('raw', name + '.' + kind).write_bytes(data)
                  item.update(status='CAPTURED_PENDING_AUDIT', bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
              except Exception as error:
                  item['error'] = str(error)
              reports.append(item)
          manifest = {'captured_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'sources': reports, 'PIT_verified': False}
          pathlib.Path('raw/manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          if not any(x['status'] == 'CAPTURED_PENDING_AUDIT' for x in reports):
              raise SystemExit('All official downloads failed; inspect the artifact manifest')
          PY
      - name: Save downloaded files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-official-revenue
          path: raw/
          retention-days: 30
