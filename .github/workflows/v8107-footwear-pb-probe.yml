name: V8.10.7 Footwear TWSE PB History Probe
on:
  workflow_dispatch:
  push:
    branches:
      - research/footwear-pb-2016-2026-20261024
    paths:
      - 'scripts/v8107_footwear_official_pb_history.py'
      - 'tests/test_v8107_footwear_official_pb_history.py'
      - '.github/workflows/v8107-footwear-pb-probe.yml'
permissions:
  contents: write
concurrency:
  group: v8107-footwear-pb-probe
  cancel-in-progress: true
jobs:
  probe-official-twse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test ROC date, TWSE P/B, IPO and no fake certified extremes
        run: python -m unittest -v tests.test_v8107_footwear_official_pb_history
      - name: Probe 3 source months each for five listed shoe companies
        run: python scripts/v8107_footwear_official_pb_history.py --mode probe --workers 3
      - name: Save raw source SHA receipts and uncovered months without claiming full 10y
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-market-data/research/footwear_pb_2016_2026/*_probe_originals.json.gz tw-market-data/research/footwear_pb_2016_2026/probe_pb_summary.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data: partial official TWSE PB source probe not complete ten years"
            git fetch origin research/footwear-pb-2016-2026-20261024
            git rebase origin/research/footwear-pb-2016-2026-20261024
            git push origin HEAD:research/footwear-pb-2016-2026-20261024
          fi
