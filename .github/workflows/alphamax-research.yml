name: AlphaMax Independent Research
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alphamax/**'
      - 'scripts/alphamax_run.py'
      - 'scripts/alphamax_concentration.py'
      - 'scripts/alphamax_universe_audit.py'
      - 'scripts/alphamax_security_master.py'
      - 'scripts/alphamax_delist.py'
      - 'scripts/alphamax_tpex_delist.py'
      - 'scripts/alphamax_pk_exhibition.py'
      - 'scripts/alphamax_pk_shadow_monitor.py'
      - 'tests/test_alphamax.py'
      - 'tests/test_alphamax_pk_exhibition.py'
      - 'tests/test_alphamax_pk_shadow_monitor.py'
      - 'tests/test_alphamax_concentration.py'
      - 'tests/test_alphamax_universe.py'
      - 'tests/test_alphamax_security_master.py'
      - 'tests/test_alphamax_delist.py'
      - 'tests/test_alphamax_tpex_delist.py'
      - '.github/workflows/alphamax-research.yml'
  push:
    branches:
      - 'main'
    paths:
      - 'alphamax/**'
      - 'scripts/alphamax_run.py'
      - 'scripts/alphamax_pk_exhibition.py'
      - 'tests/test_alphamax.py'
      - 'tests/test_alphamax_pk_exhibition.py'
      - '.github/workflows/alphamax-research.yml'
  schedule:
    # 16:50 Asia/Taipei, Mon-Fri; scheduled jobs only run from default branch.
    - cron: '50 8 * * 1-5'
permissions:
  contents: read
concurrency:
  group: alphamax-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract-and-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent no-leakage and contract tests
        run: python -m unittest -v tests.test_alphamax tests.test_alphamax_concentration tests.test_alphamax_universe tests.test_alphamax_security_master tests.test_alphamax_delist tests.test_alphamax_tpex_delist tests.test_alphamax_pk_exhibition tests.test_alphamax_pk_shadow_monitor
      - name: Audit official source readiness; never fabricate returns
        run: |
          python scripts/alphamax_run.py readiness --output alphamax-research-readiness.json
      - name: Audit concentration readiness; never create an unverified buy signal
        run: python scripts/alphamax_concentration.py --output alphamax-concentration-readiness.json
      - name: Audit original historical issuer quote coverage without PIT claims
        run: python scripts/alphamax_universe_audit.py --output alphamax-universe-readiness.json
      - name: Capture current official issuer profiles with original bytes and source receipts
        run: python scripts/alphamax_security_master.py --output-dir alphamax-profile-capture
      - name: Capture TWSE official retrospective delisting event ledger
        run: python scripts/alphamax_delist.py --output-dir alphamax-delist-capture
      - name: Probe TPEx historical termination pages with official original receipts
        run: python scripts/alphamax_tpex_delist.py --output-dir alphamax-tpex-delist-capture --page-limit 15
      - name: Inspect latest official main-branch quotes for frozen PK without claiming trading performance
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          mkdir -p alphamax-pk-source
          git rev-parse origin/main > alphamax-pk-source/source-commit.txt
          git show origin/main:tw-market-data/prices/latest_manifest.json > alphamax-pk-source/manifest.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path("alphamax-pk-source/manifest.json").read_text(encoding="utf-8"))
          path = manifest["path"]
          if not path.startswith("tw-market-data/prices/") or not path.endswith(".json") or ".." in path:
              raise SystemExit("UNSAFE_MAIN_PRICE_MANIFEST_PATH")
          with Path("alphamax-pk-source/prices.json").open("wb") as out:
              subprocess.run(["git", "show", "origin/main:" + path], stdout=out, check=True)
          with Path("alphamax-pk-source/entry-prices.json").open("wb") as out:
              subprocess.run(["git", "show", "origin/main:tw-market-data/prices/2026-11-12.json"], stdout=out, check=True)
          PY
          python scripts/alphamax_pk_exhibition.py --manifest alphamax-pk-source/manifest.json --snapshot alphamax-pk-source/prices.json --output alphamax-pk-observation.json
          python scripts/alphamax_pk_shadow_monitor.py --manifest alphamax-pk-source/manifest.json --latest alphamax-pk-source/prices.json --entry alphamax-pk-source/entry-prices.json --output alphamax-pk-shadow-price-only.json
      - name: Publish separate engineering and investment-readiness status
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          research = json.loads(Path("alphamax-research-readiness.json").read_text())
          concentration = json.loads(Path("alphamax-concentration-readiness.json").read_text())
          universe = json.loads(Path("alphamax-universe-readiness.json").read_text())
          profile_file = Path("alphamax-profile-capture/capture-manifest.json")
          profiles = json.loads(profile_file.read_text()) if profile_file.exists() else {"status": "CAPTURE_MANIFEST_MISSING", "profile_count": 0}
          delist_file = Path("alphamax-delist-capture/capture-manifest.json")
          delist = json.loads(delist_file.read_text()) if delist_file.exists() else {"status": "CAPTURE_MANIFEST_MISSING", "event_count": 0}
          tpex_file = Path("alphamax-tpex-delist-capture/capture-manifest.json")
          tpex_delist = json.loads(tpex_file.read_text()) if tpex_file.exists() else {"status": "CAPTURE_MANIFEST_MISSING", "event_count": 0}
          pk_file = Path("alphamax-pk-observation.json")
          pk = json.loads(pk_file.read_text()) if pk_file.exists() else {"status": "PK_OBSERVATION_MISSING"}
          shadow_file = Path("alphamax-pk-shadow-price-only.json")
          shadow = json.loads(shadow_file.read_text()) if shadow_file.exists() else {"status": "PK_SHADOW_MISSING"}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## AlphaMax verification — do not confuse CI with trading approval\n\n")
              out.write("- Code regression CI: **executed separately above**\n")
              out.write("- Historical data/PIT readiness: **%s**\n" % research["status"])
              out.write("- Concentration allocation readiness: **%s**\n" % concentration["status"])
              out.write("- Issuer-history coverage: **%s**\n" % universe["status"])
              out.write("- Current official company roster capture: **%s**, %s issuer profiles\n" % (profiles["status"], profiles.get("profile_count", 0)))
              out.write("- Historical listed/delisted membership certified: **NO** (current profiles cannot supply past membership)\n")
              out.write("- TWSE official historical termination-date ledger: **%s**, %s events\n" % (delist["status"], delist["event_count"]))
              out.write("- TPEx termination page status: **%s**; observed rows **%s**, explicit effective dates **%s**\n" % (tpex_delist["status"], tpex_delist["event_count"], tpex_delist.get("explicit_effective_dates", 0)))
              out.write("- Historical announced-at vintage, full delisted stock universe and investor total return: **NOT CERTIFIED**\n")
              out.write("- Historical price records / latest snapshot: **%s / %s**\n" % (universe.get("counts", {}).get("present_in_snapshot_with_history", 0), universe.get("current_quote_snapshot_securities", 0)))
              out.write("- Companies with >= 756 preserved observed sessions: **%s** (observation count, not PIT audit)\n" % universe.get("counts", {}).get("history_files_ge_min_sessions", 0))
              out.write("- Snapshot rows with no valid close (not executable): **%s**\n" % universe.get("current_quote_rows_without_positive_close", 0))
              out.write("- Historical sessions with missing/invalid close: **%s** (not counted as priced sessions)\n" % universe.get("counts", {}).get("unpriced_historical_sessions", 0))
              out.write("- Live buy authorization: **NO**\n\n")
              out.write("### Frozen PK exhibition (NOT model vs model)\n\n")
              out.write("- Observation: **%s**; official winner: **NONE**\n" % pk["status"])
              obs = pk.get("observation", {})
              out.write("- Main-branch official raw quote session: **%s** (NO trades or dividend adjustments)\n" % obs.get("observation_price_date", "unknown"))
              for lane, label in (("alpha_lane", "Alpha human triage"), ("v8_lane", "V8 Growth research")):
                  stat = obs.get("lanes", {}).get(lane, {})
                  out.write("- %s raw quote coverage: **%s/10**; unadjusted baseline change: **%s%%**, NOT INVESTABLE\n" %
                            (label, stat.get("quote_coverage", "not checked"), stat.get("raw_equal_weight_close_change_pct", "N/A")))
              out.write("- Both lanes: **not certified**; no verified execution, cash dividends, corporate actions or true model-vs-model 12m outcomes\n\n")
              out.write("### Prospective post-freeze quote-only shadow monitor (NO live fills)\n\n")
              out.write("- Status: **%s**; pinned post-freeze entry proxy **%s**; last session **%s**\n" % (shadow["status"], shadow.get("entry_price_date", "N/A"), shadow.get("last_price_date", "N/A")))
              out.write("- Pinned original entry Git blob: **%s**\n" % shadow.get("entry_price_source_git_blob_sha", "MISSING"))
              for lane, label in (("alpha_lane", "Alpha human triage"), ("v8_lane", "V8 Growth research")):
                  stat = shadow.get("lanes", {}).get(lane, {})
                  out.write("- %s: **%s/10** raw quotes; cumulative unadjusted price-only change **%s%%**\n" % (label, stat.get("complete_quote_count", "missing"), stat.get("equal_initial_capital_unadjusted_price_change_pct", "N/A")))
              out.write("- 0050 raw price-only comparison: **%s%%**; **NOT** dividend/corporate-action adjusted, investable P&L, a backtest, or a winner\n\n" % shadow.get("benchmark_0050", {}).get("raw_price_only_change_pct", "N/A"))
              for issue in research.get("blockers", []):
                  out.write("- Data blocker: %s\n" % issue)
              for issue in research.get("warnings", []):
                  out.write("- Data warning: %s\n" % issue)
              if concentration.get("reason"):
                  out.write("- Allocation blocker: %s\n" % concentration["reason"])
              out.write("\nReference: GitHub issue #179. Synthetic tests cannot certify expected returns.\n")
          PY
      - name: Publish readiness as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphamax-readiness
          path: |
            alphamax-research-readiness.json
            alphamax-concentration-readiness.json
            alphamax-universe-readiness.json
            alphamax-pk-observation.json
            alphamax-pk-shadow-price-only.json
            alphamax-pk-source/
            alphamax-profile-capture/
            alphamax-delist-capture/
            alphamax-tpex-delist-capture/
          if-no-files-found: warn
          retention-days: 90
