name: Insider MOPS vs TWSE Crosscheck
on:
  workflow_dispatch:
  push:
    branches:
      - research/insider-pit-shadow-20261023
    paths:
      - 'scripts/v8105_insider_evidence_reconcile.py'
      - 'tests/test_v8105_insider_evidence_reconcile.py'
      - '.github/workflows/insider-official-crosscheck.yml'
permissions:
  contents: write
jobs:
  reconcile-two-original-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate archived official original bytes and cross-source invariants
        run: python -m unittest -v tests.test_v8105_insider_evidence_reconcile
      - name: Produce conservative crosscheck research output
        run: python scripts/v8105_insider_evidence_reconcile.py --out tw-market-data/evidence/v880/insider_reviews/20261023_two_official_sources_reconciliation.json
      - name: Store deterministic audit in unmerged research branch
        if: success() && github.ref == 'refs/heads/research/insider-pit-shadow-20261023'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-market-data/evidence/v880/insider_reviews/20261023_two_official_sources_reconciliation.json
          if ! git diff --cached --quiet; then
            git commit -m "data: verify two official insider sources; preserve PIT caveats"
            git push origin HEAD:research/insider-pit-shadow-20261023
          fi
