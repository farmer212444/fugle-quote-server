name: TW V8.8.0 shares evidence model
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/tw_v877_share_audit.yml'
      - 'tw_model_v880/**'
      - 'scripts/tw_v880_run.py'
      - 'tests/**'
      - 'scripts/v880_audit_exports.py'
  push:
    paths:
      - '.github/workflows/tw_v877_share_audit.yml'
      - 'tw_model_v880/**'
      - 'scripts/tw_v880_run.py'
      - 'tests/**'
      - 'scripts/v880_audit_exports.py'
  schedule:
    - cron: '25 13 * * *'
permissions:
  contents: write
concurrency:
  group: tw-v880-shares-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate_and_run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate model controls
        run: python scripts/tw_v880_run.py --self-test
      - name: Produce dated scenarios and evidence decisions
        run: |
          python scripts/v880_audit_exports.py --kind shares
