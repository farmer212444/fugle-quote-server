name: Taiwan Official TWSE Issuer History Backfill
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tw_history_backfill.yml'
      - 'scripts/tw_history_backfill.py'
      - 'tests/test_tw_history_backfill.py'
  pull_request:
    paths:
      - '.github/workflows/tw_history_backfill.yml'
      - 'scripts/tw_history_backfill.py'
      - 'tests/test_tw_history_backfill.py'
  schedule:
    # Priority TWSE source batches at 09:05, 12:05, 15:05, 18:05 and 20:05 TPE.
    # Earlier runs work on the latest verified price snapshot, not a live unverified close.
    - cron: '5 1,4,7,10,12 * * 1-5'
permissions:
  contents: write
concurrency:
  group: tw-historical-price-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate official monthly parser and PIT guards
        run: python -m unittest -v tests.test_tw_history_backfill
      - name: Backfill official TWSE monthly sessions for focus issuers
        if: github.event_name != 'pull_request'
        run: python scripts/tw_history_backfill.py --max-issuers 16 --months 3
      - name: Archive unmodified monthly exchange JSON
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-twse-issuer-history-originals
          path: market-raw-price-history/
          retention-days: 90
          if-no-files-found: ignore
      - name: Publish historical turnover receipts and progress
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Source writers are concurrent: re-select missing issuers from latest main
          # and republish only source-consistent artifacts. NEVER rebase regenerated JSON.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/tw_history_backfill.py --max-issuers 16 --months 3
            git add tw-market-data/prices/issuer_history/ tw-market-data/rankings/v889_backfill_progress.*
            if git diff --cached --quiet; then
              echo 'No outstanding TWSE issuer history work in this batch.'
              exit 0
            fi
            git commit -m 'data: backfill ranked official TWSE historical issuer sessions'
            if git push origin HEAD:main; then
              echo 'Published against current main after issuer re-selection.'
              exit 0
            fi
            echo "Remote changed; re-select source backlog, attempt $attempt/4"
          done
          echo '::error::SOURCE_CAPTURED_BUT_PUBLICATION_NOT_CONFIRMED_AFTER_RETRIES'
          exit 1

      - name: Preserve originals used in final conflict-safe publication
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-twse-issuer-history-final-raw
          path: market-raw-price-history/
          retention-days: 90
          if-no-files-found: ignore
