name: TW V8.8.2 cash evidence model
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/tw_v877_cash_quality.yml'
      - 'tw_model_v880/**'
      - 'scripts/tw_v880_run.py'
      - 'tests/**'
      - 'scripts/v880_audit_exports.py'
      - 'scripts/ensure_research_current.py'
      - 'requirements-model.txt'
      - 'VERSION'
  push:
    paths:
      - '.github/workflows/tw_v877_cash_quality.yml'
      - 'tw_model_v880/**'
      - 'scripts/tw_v880_run.py'
      - 'tests/**'
      - 'scripts/v880_audit_exports.py'
      - 'scripts/ensure_research_current.py'
      - 'requirements-model.txt'
      - 'VERSION'
  schedule:
    - cron: '5 13 * * *'
permissions:
  contents: write
concurrency:
  group: tw-v880-cash-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate_and_run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original earnings table reader
        run: python -m pip install -r requirements-model.txt
      - name: Validate model controls
        run: python scripts/tw_v880_run.py --self-test
      - name: Produce dated scenarios and evidence decisions
        run: |
          python scripts/ensure_research_current.py
          python scripts/v880_audit_exports.py --kind cash
