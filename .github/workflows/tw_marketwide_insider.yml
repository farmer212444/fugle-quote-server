name: Taiwan Marketwide Insider Post-trade Capture
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/tw_marketwide_insider.yml'
      - 'scripts/insider_marketwide.py'
      - 'tests/test_insider_marketwide.py'
      - 'README_INSIDER_MARKETWIDE.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tw_marketwide_insider.yml'
      - 'scripts/insider_marketwide.py'
      - 'tests/test_insider_marketwide.py'
  schedule:
    # 03:30, 09:30, 15:30, 21:30 Taipei; 6-hour spacing, 2s/request.
    - cron: '30 1,7,13,19 * * *'
permissions:
  contents: write
concurrency:
  # CI for proposed fixes must not queue behind a 30-minute main data capture.
  # All main push/schedule/dispatch capture jobs remain serialized.
  group: insider-${{ github.event_name == 'pull_request' && github.head_ref || 'main-capture' }}
  cancel-in-progress: false
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source parser, market-only transactions and coverage guards
        run: python -m unittest discover -s tests -p 'test_insider_marketwide.py' -v
  capture:
    needs: offline-tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover actual current-year market buyers; archive partial coverage
        run: python scripts/insider_marketwide.py --max-details 360 --gap 2 --time-budget-seconds 1200
      - name: Publish no-trade-claim coverage diagnostics even when feeds are down
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketwide-insider-attempt
          path: |
            tw-market-data/rankings/insider_marketwide_latest.json
            tw-market-data/rankings/insider_marketwide_latest.md
          if-no-files-found: ignore
          retention-days: 90
      - name: Commit immutable source receipts, progressive archives and research-only ranking
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-market-data/insider/ tw-market-data/rankings/insider_marketwide_latest.json tw-market-data/rankings/insider_marketwide_latest.md
          if git diff --cached --quiet; then
            echo 'No new certified raw snapshots.'
            exit 0
          fi
          # Snapshot the actual network collection stats before any concurrent
          # main-branch rebase may replace the ranking JSON.
          cp tw-market-data/rankings/insider_marketwide_latest.json "${RUNNER_TEMP}/insider-original-run.json"
          git commit -m 'data: progressive official insider filings and fail-closed marketwide coverage'
          # Rebase chooses the already-published main-side receipt on conflicting
          # mutable pointers; immutable hash-addressed originals are still
          # retained in the union. Then regenerate the report from the *merged*
          # SHA-checked archives offline, never from stale pre-rebase totals.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X ours origin/main
            python scripts/insider_marketwide.py --rebuild-only --max-details 0 --collection-state-file "${RUNNER_TEMP}/insider-original-run.json"
            git add tw-market-data/rankings/insider_marketwide_latest.json tw-market-data/rankings/insider_marketwide_latest.md
            if ! git diff --cached --quiet; then
              git commit -m 'data: reconcile verified insider coverage after concurrent main update'
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Remote moved during archive publish; retrying verified rebase (${attempt}/3)." >&2
          done
          echo 'Failed to publish verified source receipts after three safe retries.' >&2
          exit 1
