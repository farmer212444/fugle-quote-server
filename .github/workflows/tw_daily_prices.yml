name: Taiwan Official Daily Stock Prices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tw_daily_prices.yml'
      - 'scripts/v8a4_market_close_recovery.py'
      - 'scripts/execution_quote_archive.py'
      - 'scripts/collect_official_prices.py'
      - 'tw_model_v880/freshness.py'
      - 'tests/test_collect_official_prices.py'
      - 'tests/test_v8a4_market_close_recovery.py'
  schedule:
    # Taiwan market close: schedule uses UTC, notes use Asia/Taipei (UTC+8).
    - cron: '40 5 * * 1-5'   # 13:40 Mon-Fri: diagnostic probe ONLY
    - cron: '20 6 * * 1-5'   # 14:20 Mon-Fri: first eligible publish
    - cron: '45 7 * * 1-5'   # 15:45 Mon-Fri: retry
    - cron: '45 9 * * 1-5'   # 17:45 Mon-Fri: retry
    - cron: '40 11 * * 1-5'  # 19:40 Mon-Fri: retry
    - cron: '40 12 * * 1-5'  # 20:40 Mon-Fri: final evening retry
    - cron: '10 0 * * 2-6'   # 08:10 Tue-Sat: prior-session recovery
permissions:
  contents: write
concurrency:
  group: tw-official-close-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify strictly dated bulk-market exchange fallback
        run: python -m unittest -v tests.test_v8a4_market_close_recovery tests.test_collect_official_prices tests.test_v8a3_price_freshness
      - name: Capture and validate latest TWSE TPEx prices
        shell: bash
        env:
          PROBE_ONLY: ${{ github.event_name == 'schedule' && github.event.schedule == '40 5 * * 1-5' }}
        run: |
          options=()
          if [ "$PROBE_ONLY" = 'true' ]; then
            options+=(--probe-only)
          fi
          python scripts/collect_official_prices.py "${options[@]}"
      - name: Save raw official price snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-official-raw-daily-price
          path: market-raw-daily/
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit verified daily price data
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || github.event.schedule != '40 5 * * 1-5') }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-market-data/prices/
          if git diff --cached --quiet; then
            echo 'No new closing-price data.'
            exit 0
          fi
          git commit -m 'data: archive verified official daily closing prices'
          # Other daily data jobs may push to main while prices are collected.
          # Rebase only; never force-push or lose an existing issuer snapshot.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::Could not safely rebase price snapshot; no data overwritten.'
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'Verified official price snapshot pushed; research workflow will refresh on manifest change.'
              exit 0
            fi
            echo "Price publication conflict; retry $attempt/3"
            sleep 8
          done
          echo '::error::Price snapshot not published after three retries.'
          exit 1
