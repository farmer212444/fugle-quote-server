name: V8.9 PIT and evidence regression tests
on:
  push:
    branches: [main, feature/v89-cycle-alpha, feature/v89-pit-sector-cert-hardening]
    paths:
      - 'tw_model_v880/cycle_alpha.py'
      - 'tw_model_v880/model.py'
      - 'scripts/tw_v880_run.py'
      - 'tw_model_v880/evidence.py'
      - 'tests/test_cycle_alpha.py'
      - 'tests/test_v880.py'
      - 'tests/test_integration_v880.py'
      - '.github/workflows/v89-cycle-alpha-tests.yml'
  pull_request:
    paths:
      - 'tw_model_v880/cycle_alpha.py'
      - 'tw_model_v880/model.py'
      - 'scripts/tw_v880_run.py'
      - 'tw_model_v880/evidence.py'
      - 'tests/test_cycle_alpha.py'
      - 'tests/test_v880.py'
      - 'tests/test_integration_v880.py'
      - '.github/workflows/v89-cycle-alpha-tests.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: PIT, valuation and certification regression
        run: python -m pytest -q tests/test_cycle_alpha.py tests/test_v880.py tests/test_integration_v880.py
