name: V8.10.7 Footwear Official Full 10Y PB
on:
  workflow_dispatch:
  push:
    branches:
      - research/footwear-pb-2016-2026-20261024
    paths:
      - '.github/workflows/v8107-footwear-pb-full.yml'
concurrency:
  group: v8107-footwear-pb-full-2016-2026
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  historical-exchange-pb:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard P/B source parsing and no pre-listing fake observations
        run: python -m unittest -v tests.test_v8107_footwear_official_pb_history
      - name: Fetch complete TWSE daily PB in monthly original source envelopes
        run: python scripts/v8107_footwear_official_pb_history.py --mode full --workers 3
      - name: Archive raw official response bytes and audit coverage even when incomplete
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-market-data/research/footwear_pb_2016_2026/*_full_originals.json.gz tw-market-data/research/footwear_pb_2016_2026/full_pb_summary.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data: immutable full-range official TWSE footwear PB retrieval and any missing-month warnings"
            for attempt in 1 2 3; do
              git fetch origin research/footwear-pb-2016-2026-20261024
              git rebase origin/research/footwear-pb-2016-2026-20261024 || {
                git rebase --abort || true
                exit 1
              }
              if git push origin HEAD:research/footwear-pb-2016-2026-20261024; then
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
