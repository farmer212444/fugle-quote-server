name: TW V8.7.7 Official Fundamentals (not A+ certification)
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/tw_fundamentals.py'
      - '.github/workflows/tw_fundamentals.yml'
  schedule:
    # 19:55 Asia/Taipei every day. GitHub cron may be delayed.
    - cron: '55 11 * * *'
permissions:
  contents: write
concurrency:
  group: tw-official-fundamentals
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install 'pandas>=2.2,<3' 'lxml>=5,<7'
      - name: Test parser and PIT cutoff
        run: python scripts/tw_fundamentals.py --self-test
      - name: Capture incremental official quarterly snapshots
        run: python scripts/tw_fundamentals.py --max-fetches 12
      - name: Archive source HTML for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-official-quarterly-originals
          path: market-raw-quarterly/
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit normalized verified snapshots and provisional scan
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-market-data/fundamentals/
          if git diff --cached --quiet; then
            echo 'No new financial snapshot.'
          else
            git commit -m 'data: archive provisional official quarterly financial evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
