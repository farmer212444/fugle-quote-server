name: V8.8.0 PIT Backtest Tests
on:
  pull_request:
    paths:
      - 'scripts/tw_v880_pit_backtest.py'
      - '.github/workflows/v880-pit-backtest.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: PIT walk-forward anti-lookahead tests
        run: |
          python scripts/tw_v880_pit_backtest.py --self-test
          python -m py_compile scripts/tw_v880_pit_backtest.py
