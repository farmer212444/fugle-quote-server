name: Buyback event PIT/OOS research checks
on:
  pull_request:
    paths:
      - 'scripts/buyback_event_backtest.py'
      - 'tests/test_buyback_event_backtest.py'
      - 'README_BUYBACK_EVENT_OOS.md'
      - '.github/workflows/buyback-event-oos-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Block lookahead and missing TR sources
        run: python -m pytest -q tests/test_buyback_event_backtest.py
      - name: Unavailable original inputs must not output fabricated returns
        run: |
          set +e
          python scripts/buyback_event_backtest.py --out /tmp/buyback_status.json
          code=$?
          set -e
          test "$code" -eq 2
          python -c "import json; x=json.load(open('/tmp/buyback_status.json')); assert x['status']=='BLOCKED_MISSING_SOURCE_FILES' and x['win_rate_pct'] is None"
