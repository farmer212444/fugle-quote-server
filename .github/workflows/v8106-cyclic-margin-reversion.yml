name: V8.10.6 Cyclic Margin Reversion Shadow
on:
  workflow_dispatch:
  push:
    branches:
      - research/2027-cross-sector-margin-safety-20261024
    paths:
      - 'scripts/v8106_three_issuer_margin_reversion.py'
      - 'tests/test_v8106_three_issuer_margin_reversion.py'
      - 'tw-market-data/evidence/v8106_cross_sector_gm_source_observations_20261024.json'
      - '.github/workflows/v8106-cyclic-margin-reversion.yml'
concurrency:
  group: v8106-cycle-margin-20261024
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  source-dated-three-sector-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert historic Q2 margin anchor and 13-gate no-promotion controls
        run: python -m unittest -v tests.test_v8106_three_issuer_margin_reversion
      - name: Evaluate 2027 gross margin normalization and PE stress
        run: python scripts/v8106_three_issuer_margin_reversion.py
      - name: Archive risk report without touching main branch
        if: success() && github.ref == 'refs/heads/research/2027-cross-sector-margin-safety-20261024'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-market-data/rankings/v8106_three_issuer_margin_reversion_shadow.json
          if ! git diff --cached --quiet; then
            git commit -m "data: 2027 steel lens IPC cyclical GM and PE shadow stress"
            for attempt in 1 2 3; do
              git fetch origin research/2027-cross-sector-margin-safety-20261024
              git rebase origin/research/2027-cross-sector-margin-safety-20261024 || {
                git rebase --abort || true
                exit 1
              }
              if git push origin HEAD:research/2027-cross-sector-margin-safety-20261024; then
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
