name: TW V8.8.2 research evidence model
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/tw_v877_research_rank.yml'
      - 'tw_model_v880/**'
      - 'scripts/tw_v880_run.py'
      - 'scripts/v881_history_diagnostic.py'
      - 'scripts/build_universe_verification_queue.py'
      - 'scripts/diagnose_unmodeled_universe.py'
      - 'scripts/v881_unmodeled_blockers.py'
      - 'scripts/v881_thin_shadow.py'
      - 'scripts/v883_gate_orchestrator.py'
      - 'scripts/v884_evidence_probe.py'
      - 'scripts/v886_9802_early_revalue.py'
      - 'scripts/tw_chip_diagnostic.py'
      - 'tests/**'
      - 'scripts/build_v880_evidence.py'
      - 'scripts/refresh_v880_public.py'
      - 'scripts/refresh_v881_capital.py'
      - 'scripts/tw_v877_quality_rank.py'
      - 'tw-market-data/evidence/v880/certificates/**'
      - 'tw-market-data/evidence/v880/issuer_bridges/**'
      - 'tw-market-data/evidence/v880/capital_terms/**'
      - 'tw-market-data/fundamentals/early_watch/**'
      - 'tw-market-data/fundamentals/latest_scan.json'
      - 'tw-market-data/fundamentals/*/TWSE_income.json'
      - 'tw-market-data/fundamentals/*/TPEX_income.json'
      - 'tw-market-data/fundamentals/*/TWSE_cashflow.json'
      - 'tw-market-data/fundamentals/*/TPEX_cashflow.json'
      - 'tw-market-data/prices/latest_manifest.json'
      - 'tw-market-data/financial/latest_manifest.json'
  push:
    paths:
      - '.github/workflows/tw_v877_research_rank.yml'
      - 'tw_model_v880/**'
      - 'scripts/tw_v880_run.py'
      - 'scripts/v881_history_diagnostic.py'
      - 'scripts/build_universe_verification_queue.py'
      - 'scripts/diagnose_unmodeled_universe.py'
      - 'scripts/v881_unmodeled_blockers.py'
      - 'scripts/v881_thin_shadow.py'
      - 'scripts/v883_gate_orchestrator.py'
      - 'scripts/v884_evidence_probe.py'
      - 'scripts/v886_9802_early_revalue.py'
      - 'scripts/tw_chip_diagnostic.py'
      - 'tests/**'
      - 'scripts/build_v880_evidence.py'
      - 'scripts/refresh_v880_public.py'
      - 'scripts/refresh_v881_capital.py'
      - 'scripts/tw_v877_quality_rank.py'
      - 'tw-market-data/evidence/v880/certificates/**'
      - 'tw-market-data/evidence/v880/issuer_bridges/**'
      - 'tw-market-data/evidence/v880/capital_terms/**'
      - 'tw-market-data/fundamentals/early_watch/**'
      - 'tw-market-data/fundamentals/latest_scan.json'
      - 'tw-market-data/fundamentals/*/TWSE_income.json'
      - 'tw-market-data/fundamentals/*/TPEX_income.json'
      - 'tw-market-data/fundamentals/*/TWSE_cashflow.json'
      - 'tw-market-data/fundamentals/*/TPEX_cashflow.json'
      - 'tw-market-data/prices/latest_manifest.json'
      - 'tw-market-data/financial/latest_manifest.json'
  schedule:
    # 21:30 Taipei: after 19:40 prices and 19:55 fundamentals (65-minute max runtime).
    - cron: '30 13 * * *'
permissions:
  contents: write
concurrency:
  group: tw-v880-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate_and_run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate model controls
        run: python scripts/tw_v880_run.py --self-test
      - name: Refresh static official sources
        if: github.event_name != 'pull_request'
        run: python scripts/refresh_v880_public.py
      - name: Produce dated scenarios and evidence decisions
        run: |
          python scripts/tw_v880_run.py --target-date 2027-12-31
          python scripts/v881_history_diagnostic.py
          python scripts/build_universe_verification_queue.py
          python scripts/diagnose_unmodeled_universe.py
          python scripts/v881_unmodeled_blockers.py
          python scripts/v881_thin_shadow.py
          python scripts/v883_gate_orchestrator.py --top 50
          python scripts/v884_evidence_probe.py --top 50
          python scripts/v886_9802_early_revalue.py
          python scripts/tw_chip_diagnostic.py
          python scripts/v880_audit_exports.py --kind risk
          python scripts/v880_audit_exports.py --kind cash
          python scripts/v880_audit_exports.py --kind shares
      - name: Save current results on main only (retry from fresh origin)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # Competing scheduled data writers can update snapshots while this job runs.
            # Rebuild against the newest main rather than rebasing generated artifacts.
            git fetch origin main
            git reset --hard origin/main
            python scripts/refresh_v880_public.py
            python scripts/tw_v880_run.py --target-date 2027-12-31
            python scripts/v881_history_diagnostic.py
            python scripts/build_universe_verification_queue.py
            python scripts/diagnose_unmodeled_universe.py
            python scripts/v881_unmodeled_blockers.py
            python scripts/v881_thin_shadow.py
            python scripts/v883_gate_orchestrator.py --top 50
            python scripts/v884_evidence_probe.py --top 50
          python scripts/v886_9802_early_revalue.py
            python scripts/tw_chip_diagnostic.py
            python scripts/v880_audit_exports.py --kind risk
            python scripts/v880_audit_exports.py --kind cash
            python scripts/v880_audit_exports.py --kind shares
            git add tw-market-data/evidence/v880 tw-market-data/rankings
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data: refresh V8.8.2 research and evidence status'
            if git push origin HEAD:main; then exit 0; fi
            echo "Remote moved during generated data publication; retrying from latest data"
          done
          exit 1
