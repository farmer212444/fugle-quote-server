name: TW V8.8.0 research evidence model
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/tw_v877_research_rank.yml'
      - 'tw_model_v880/**'
      - 'scripts/tw_v880_run.py'
      - 'tests/**'
      - 'scripts/build_v880_evidence.py'
      - 'scripts/refresh_v880_public.py'
      - 'scripts/tw_v877_quality_rank.py'
      - 'tw-market-data/evidence/v880/certificates/**'
      - 'tw-market-data/evidence/v880/issuer_bridges/**'
  push:
    paths:
      - '.github/workflows/tw_v877_research_rank.yml'
      - 'tw_model_v880/**'
      - 'scripts/tw_v880_run.py'
      - 'tests/**'
      - 'scripts/build_v880_evidence.py'
      - 'scripts/refresh_v880_public.py'
      - 'scripts/tw_v877_quality_rank.py'
      - 'tw-market-data/evidence/v880/certificates/**'
      - 'tw-market-data/evidence/v880/issuer_bridges/**'
  schedule:
    - cron: '25 12 * * *'
permissions:
  contents: write
concurrency:
  group: tw-v880-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate_and_run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate model controls
        run: python scripts/tw_v880_run.py --self-test
      - name: Refresh static official sources
        if: github.event_name != 'pull_request'
        run: python scripts/refresh_v880_public.py
      - name: Produce dated scenarios and evidence decisions
        run: |
          python scripts/tw_v880_run.py --target-date 2027-12-31
          python scripts/v880_audit_exports.py --kind risk
          python scripts/v880_audit_exports.py --kind cash
          python scripts/v880_audit_exports.py --kind shares
      - name: Save current results on main only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tw-market-data/evidence/v880 tw-market-data/rankings
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh V8.8.0 research and evidence status'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
