permissions:
  contents: write
concurrency:
  group: tw-v880-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  price_update_check:
    # Only eligible completion events need verification. Early diagnostic probes
    # and retries without new verified prices do not require an extra model run.
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      refresh: ${{ steps.determine.outputs.refresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check latest committed price source against last model publication
        id: determine
        shell: bash
        run: |
          # Compare commit ancestry rather than clock time. Re-run on a same-date
          # official price correction; skip if a ranking already includes it.
          price_commit=$(git log -1 --format=%H -- tw-market-data/prices/latest_manifest.json)
          ranking_commit=$(git log -1 --format=%H -- tw-market-data/rankings/latest_research.json)
          issuer_history_commit=$(git log -1 --format=%H -- tw-market-data/prices/issuer_history/ || true)
          if [ -z "$price_commit" ] || [ -z "$ranking_commit" ]; then
            echo 'refresh=true' >> "$GITHUB_OUTPUT"
            echo '::notice::Missing source or ranked snapshot; research refresh required.'
          elif ! git merge-base --is-ancestor "$price_commit" "$ranking_commit"; then
            echo 'refresh=true' >> "$GITHUB_OUTPUT"
            echo "Unprocessed official price update: $price_commit"
          elif [ -n "$issuer_history_commit" ] && ! git merge-base --is-ancestor "$issuer_history_commit" "$ranking_commit"; then
            echo 'refresh=true' >> "$GITHUB_OUTPUT"
            echo "New official issuer-history backfill requires evidence refresh: $issuer_history_commit"
          else
            echo 'refresh=false' >> "$GITHUB_OUTPUT"
            echo 'Research already incorporates current price and source-history archive.'
          fi
  validate_and_run:
    needs: price_update_check
    if: ${{ always() && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && needs.price_update_check.outputs.refresh == 'true')) }}
    runs-on: ubuntu-latest
    # Up to three main-publication attempts can each rebuild sources and audits.
    # The former 15-minute cap cancelled a valid third attempt after two writers.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original earnings table reader
        run: python -m pip install -r requirements-model.txt
      - name: Validate model controls and independent 6206 triage
        run: |
          python scripts/tw_v880_run.py --self-test
          python -m unittest -v tests.test_early_bulk_earnings tests.test_early_bulk_transport
          python -m unittest -v tests.test_oneoff_original
          python -m unittest -v tests.test_top10_source_refresh
          python -m unittest -v tests.test_readiness_lanes tests.test_aplus_work_queue_repair tests.test_2330_2317_dual_lane tests.test_dual_focus_publication tests.test_research_pipeline
          python -m unittest -v tests.test_tsmc_original_statements
          python -m unittest -v tests.test_2317_original_statements
          python -m unittest -v tests.test_2317_twse_q2_source
          python -m unittest -v tests.test_tsmc_sec_filing_archive
          python -m unittest -v tests.test_footwear_review
          python -m unittest -v tests.test_earnings_version_review
          python -m unittest -v tests.test_9802_cash_review
          python -m unittest -v tests.test_superforecast_ledger
          python -m unittest -v tests.test_expected_returns tests.test_expected_return_readiness
          python -m unittest -v tests.test_v8b8_buy_decision_shadow
          python -m unittest -v tests.test_current_research_screens tests.test_tpex_research_liquidity tests.test_return_model_search
          python -m unittest -v tests.test_historical_pit_admission tests.test_historical_pit_readiness
          python -m unittest -v tests.test_sec_pit_intake tests.test_sec_api_intake tests.test_issuer_earnings_intake tests.test_issuer_pdf_originals
          python -m unittest -v tests.test_v8a8_forward_top30_0050
          python -m unittest discover -s tests -p test_v891_6206_gate_triage.py
          python -m unittest discover -s tests -p test_v892_top20_quality_audit.py
          python -m unittest discover -s tests -p test_v894_revenue_lead_discovery.py
      - name: Refresh static official sources
        if: github.event_name != 'pull_request'
        run: python scripts/refresh_v880_public.py
      - name: Archive partial-quarter official results and issuer announcements for current Top10
        if: github.event_name != 'pull_request'
        run: python scripts/early_bulk_earnings.py
      - name: Archive source-pinned selected one-off gains without issuing quality PASS
        if: github.event_name != 'pull_request'
        run: python scripts/oneoff_original_review.py
      - name: Archive official total-return benchmark and recent regime history
        if: github.event_name != 'pull_request'
        run: python scripts/benchmark_sources.py
      - name: Archive official 8383 Q1/Q2 original PDFs into immutable SHA receipts
        if: github.event_name != 'pull_request'
        run: python scripts/v8a9_8383_original_archive.py
      - name: Run bounded 8383 original PDF archive regression checks
        run: python -m unittest discover -s tests -p test_v8a9_8383_original_archive.py
      - name: Archive issuer-linked 2330 full financial statements without certifying unreviewed contents
        if: github.event_name != 'pull_request'
        run: python scripts/tsmc_original_statements.py
      - name: Archive SEC filed 2330 full English translations when issuer PDF access is blocked
        if: github.event_name != 'pull_request'
        run: python scripts/tsmc_sec_filing_archive.py
      - name: Archive official 2317 quarterly original PDFs with SHA, not formal PASS
        if: github.event_name != 'pull_request'
        run: python scripts/honhai_original_statements.py
      - name: Admit verified original-source review packs before valuation
        run: python scripts/v891_gate_certification.py --issue-only
      - name: Produce dated scenarios and evidence decisions
        run: python scripts/run_research_pipeline.py --phase core
      - name: Recheck current Top10 issuers after ranking changes before publication
        if: github.event_name != 'pull_request'
        run: python scripts/refresh_top10_sources.py
      - name: Verify 2330/2317 generated report matches its evidence ledger
        run: python scripts/verify_dual_focus_publication.py
      - name: Verify 0056 constituent 2027 EPS/PE stresses from exact archived model
        run: |
          python -m unittest discover -s tests -p test_v8b5_0056_stress.py
          python scripts/v8b5_0056_stress_audit.py --root tw-market-data --out tw-market-data/rankings/0056_2027_stress_latest.json --print-json
      - name: Verify 0056 financial nine BVPS PB / implied-ROE hurdles (not formal valuation)
        run: |
          python -m unittest discover -s tests -p test_v8b6_0056_financial_pb.py
          python scripts/v8b6_0056_financial_pb_hurdle.py --root tw-market-data --out tw-market-data/rankings/0056_financial_pb_hurdle_latest.json
      - name: Verify nine-bank financial Ke/g sensitivity without target-price certification
        run: |
          python -m unittest discover -s tests -p test_v8b7_0056_financial_sensitivity.py
          python scripts/v8b7_0056_financial_hurdle_sensitivity.py --root tw-market-data --out tw-market-data/rankings/0056_financial_pb_sensitivity_latest.json
      - name: Validate observation reports without publishing a PR vintage
        if: github.event_name == 'pull_request'
        run: python scripts/run_research_pipeline.py --phase observation
      - name: Verify forward challenge readiness on PR
        if: github.event_name == 'pull_request'
        run: python scripts/v8a8_forward_top30_0050.py
      - name: Save current results on main only (retry from fresh origin)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # Reuse the validated outputs if the checked-out source commit is
            # still main. Any concurrent writer forces a rebuild from its state;
            # generated files are never rebased or merged across source vintages.
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              git reset --hard origin/main
              python -m pip install -r requirements-model.txt
              python scripts/refresh_v880_public.py
              python scripts/early_bulk_earnings.py
              python scripts/oneoff_original_review.py
              python scripts/benchmark_sources.py
              python scripts/v8a9_8383_original_archive.py
              python scripts/tsmc_original_statements.py
              python scripts/tsmc_sec_filing_archive.py
              python scripts/honhai_original_statements.py
              python scripts/v891_gate_certification.py --issue-only
              python scripts/run_research_pipeline.py --phase core
              python scripts/refresh_top10_sources.py
            fi
            python scripts/v897_freeze_model_vintage.py --git-source-sha "$(git rev-parse HEAD)" --register-benchmark
            python scripts/run_research_pipeline.py --phase observation
            python scripts/v8a8_forward_top30_0050.py
            python scripts/v8b5_0056_stress_audit.py --root tw-market-data --out tw-market-data/rankings/0056_2027_stress_latest.json
            python scripts/v8b6_0056_financial_pb_hurdle.py --root tw-market-data --out tw-market-data/rankings/0056_financial_pb_hurdle_latest.json
            python scripts/v8b7_0056_financial_hurdle_sensitivity.py --root tw-market-data --out tw-market-data/rankings/0056_financial_pb_sensitivity_latest.json
            python scripts/verify_dual_focus_publication.py
            git add tw-market-data/evidence/v880 tw-market-data/rankings tw-market-data/pit_vintages tw-market-data/experiments tw-market-data/benchmarks
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data: refresh institutional research, earnings revisions and evidence status'
            if git push origin HEAD:main; then exit 0; fi
            echo "Remote moved during generated data publication; retrying from latest data"
          done
          exit 1
      - name: Preserve research stage timings including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-pipeline-timing
          path: tw-market-data/rankings/latest*_timing.json
          if-no-files-found: ignore
          retention-days: 14
