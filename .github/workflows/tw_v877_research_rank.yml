name: TW V8.8.2 research evidence model
on:
  workflow_dispatch:
  # GITHUB_TOKEN price commits do not fire downstream "push" workflows;
  # workflow_run independently observes completed price collector jobs.
  workflow_run:
    workflows:
      - Taiwan Official Daily Stock Prices
      - Taiwan Official TWSE Issuer History Backfill
      - Taiwan Official TPEx Issuer History Backfill
    types:
      - completed
  pull_request:
    paths:
      - '.github/workflows/tw_v877_research_rank.yml'
      - 'tw_model_v880/**'
      - 'scripts/tw_v880_run.py'
      - 'scripts/v881_history_diagnostic.py'
      - 'scripts/build_universe_verification_queue.py'
      - 'scripts/diagnose_unmodeled_universe.py'
      - 'scripts/v881_unmodeled_blockers.py'
      - 'scripts/v881_thin_shadow.py'
      - 'scripts/v883_gate_orchestrator.py'
      - 'scripts/v884_evidence_probe.py'
      - 'scripts/tw_history_backfill.py'
      - 'tw-market-data/prices/issuer_history/**'
      - 'scripts/v886_9802_early_revalue.py'
      - 'scripts/v888_6206_valuation.py'
      - 'scripts/v891_6206_gate_triage.py'
      - 'scripts/v890_five_candidate_audit.py'
      - 'scripts/v892_top20_quality_audit.py'
      - 'scripts/v894_revenue_lead_discovery.py'
      - 'scripts/v8a5_quality_decision_lane.py'
      - 'scripts/institutional_review.py'
      - 'scripts/institutional_shadow.py'
      - 'requirements-model.txt'
      - 'VERSION'
      - 'tw-market-data/config/institutional_research.json'
      - 'tw-market-data/experiments/**'
      - 'tw-market-data/evidence/v880/risk_profiles/**'
      - 'scripts/v8a6_etf_rotation_watch.py'
      - 'tw-market-data/evidence/v880/etf_index_constituent_events.json'
      - 'tests/test_v8a5_quality_decision_lane.py'
      - 'tests/test_v8a6_etf_rotation_watch.py'
      - 'scripts/v897_freeze_model_vintage.py'
      - 'README_V894.md'
      - 'scripts/v891_gate_certification.py'
      - 'tw-market-data/evidence/v880/review_packs/**'
      - 'tw-market-data/evidence/v880/originals/**'
      - 'tw-market-data/ir/6206/**'
      - 'scripts/tw_chip_diagnostic.py'
      - 'tests/**'
      - 'scripts/build_v880_evidence.py'
      - 'scripts/refresh_v880_public.py'
      - 'scripts/refresh_v881_capital.py'
      - 'scripts/tw_v877_quality_rank.py'
      - 'tw-market-data/evidence/v880/certificates/**'
      - 'tw-market-data/evidence/v880/issuer_bridges/**'
      - 'tw-market-data/evidence/v880/capital_terms/**'
      - 'tw-market-data/fundamentals/early_watch/**'
      - 'tw-market-data/fundamentals/latest_scan.json'
      - 'tw-market-data/fundamentals/*/TWSE_income.json'
      - 'tw-market-data/fundamentals/*/TPEX_income.json'
      - 'tw-market-data/fundamentals/*/TWSE_cashflow.json'
      - 'tw-market-data/fundamentals/*/TPEX_cashflow.json'
      - 'tw-market-data/prices/latest_manifest.json'
      - 'tw-market-data/financial/latest_manifest.json'
  push:
    paths:
      - '.github/workflows/tw_v877_research_rank.yml'
      - 'tw_model_v880/**'
      - 'scripts/tw_v880_run.py'
      - 'scripts/v881_history_diagnostic.py'
      - 'scripts/build_universe_verification_queue.py'
      - 'scripts/diagnose_unmodeled_universe.py'
      - 'scripts/v881_unmodeled_blockers.py'
      - 'scripts/v881_thin_shadow.py'
      - 'scripts/v883_gate_orchestrator.py'
      - 'scripts/v884_evidence_probe.py'
      - 'scripts/tw_history_backfill.py'
      - 'tw-market-data/prices/issuer_history/**'
      - 'scripts/v886_9802_early_revalue.py'
      - 'scripts/v888_6206_valuation.py'
      - 'scripts/v891_6206_gate_triage.py'
      - 'scripts/v890_five_candidate_audit.py'
      - 'scripts/v892_top20_quality_audit.py'
      - 'scripts/v894_revenue_lead_discovery.py'
      - 'scripts/v8a5_quality_decision_lane.py'
      - 'scripts/institutional_review.py'
      - 'scripts/institutional_shadow.py'
      - 'requirements-model.txt'
      - 'VERSION'
      - 'tw-market-data/config/institutional_research.json'
      - 'tw-market-data/experiments/**'
      - 'tw-market-data/evidence/v880/risk_profiles/**'
      - 'scripts/v8a6_etf_rotation_watch.py'
      - 'tw-market-data/evidence/v880/etf_index_constituent_events.json'
      - 'tests/test_v8a5_quality_decision_lane.py'
      - 'tests/test_v8a6_etf_rotation_watch.py'
      - 'scripts/v897_freeze_model_vintage.py'
      - 'README_V894.md'
      - 'scripts/v891_gate_certification.py'
      - 'tw-market-data/evidence/v880/review_packs/**'
      - 'tw-market-data/evidence/v880/originals/**'
      - 'tw-market-data/ir/6206/**'
      - 'scripts/tw_chip_diagnostic.py'
      - 'tests/**'
      - 'scripts/build_v880_evidence.py'
      - 'scripts/refresh_v880_public.py'
      - 'scripts/refresh_v881_capital.py'
      - 'scripts/tw_v877_quality_rank.py'
      - 'tw-market-data/evidence/v880/certificates/**'
      - 'tw-market-data/evidence/v880/issuer_bridges/**'
      - 'tw-market-data/evidence/v880/capital_terms/**'
      - 'tw-market-data/fundamentals/early_watch/**'
      - 'tw-market-data/fundamentals/latest_scan.json'
      - 'tw-market-data/fundamentals/*/TWSE_income.json'
      - 'tw-market-data/fundamentals/*/TPEX_income.json'
      - 'tw-market-data/fundamentals/*/TWSE_cashflow.json'
      - 'tw-market-data/fundamentals/*/TPEX_cashflow.json'
      - 'tw-market-data/prices/latest_manifest.json'
      - 'tw-market-data/financial/latest_manifest.json'
  schedule:
    # 21:30 Taipei: after 19:40 prices and 19:55 fundamentals (65-minute max runtime).
    - cron: '30 13 * * *'
permissions:
  contents: write
concurrency:
  group: tw-v880-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  price_update_check:
    # Only eligible completion events need verification. Early diagnostic probes
    # and retries without new verified prices do not require an extra model run.
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      refresh: ${{ steps.determine.outputs.refresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check latest committed price source against last model publication
        id: determine
        shell: bash
        run: |
          # Compare commit ancestry rather than clock time. Re-run on a same-date
          # official price correction; skip if a ranking already includes it.
          price_commit=$(git log -1 --format=%H -- tw-market-data/prices/latest_manifest.json)
          ranking_commit=$(git log -1 --format=%H -- tw-market-data/rankings/latest_research.json)
          issuer_history_commit=$(git log -1 --format=%H -- tw-market-data/prices/issuer_history/ || true)
          if [ -z "$price_commit" ] || [ -z "$ranking_commit" ]; then
            echo 'refresh=true' >> "$GITHUB_OUTPUT"
            echo '::notice::Missing source or ranked snapshot; research refresh required.'
          elif ! git merge-base --is-ancestor "$price_commit" "$ranking_commit"; then
            echo 'refresh=true' >> "$GITHUB_OUTPUT"
            echo "Unprocessed official price update: $price_commit"
          elif [ -n "$issuer_history_commit" ] && ! git merge-base --is-ancestor "$issuer_history_commit" "$ranking_commit"; then
            echo 'refresh=true' >> "$GITHUB_OUTPUT"
            echo "New official issuer-history backfill requires evidence refresh: $issuer_history_commit"
          else
            echo 'refresh=false' >> "$GITHUB_OUTPUT"
            echo 'Research already incorporates current price and source-history archive.'
          fi
  validate_and_run:
    needs: price_update_check
    if: ${{ always() && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && needs.price_update_check.outputs.refresh == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original earnings table reader
        run: python -m pip install -r requirements-model.txt
      - name: Validate model controls and independent 6206 triage
        run: |
          python scripts/tw_v880_run.py --self-test
          python -m unittest discover -s tests -p test_v891_6206_gate_triage.py
          python -m unittest discover -s tests -p test_v892_top20_quality_audit.py
          python -m unittest discover -s tests -p test_v894_revenue_lead_discovery.py
      - name: Refresh static official sources
        if: github.event_name != 'pull_request'
        run: python scripts/refresh_v880_public.py
      - name: Admit verified original-source review packs before valuation
        run: python scripts/v891_gate_certification.py --issue-only
      - name: Produce dated scenarios and evidence decisions
        run: |
          python scripts/tw_v880_run.py --target-date 2027-12-31
          python scripts/v881_history_diagnostic.py
          python scripts/build_universe_verification_queue.py
          python scripts/diagnose_unmodeled_universe.py
          python scripts/v881_unmodeled_blockers.py
          python scripts/v881_thin_shadow.py
          python scripts/v883_gate_orchestrator.py --top 50
          python scripts/v884_evidence_probe.py --top 50 --focus 8390 1785 5439 4739 9802 6206
          python scripts/v891_gate_certification.py
          python scripts/v886_9802_early_revalue.py
          python scripts/v888_6206_valuation.py
          python scripts/v891_6206_gate_triage.py
          python scripts/tw_chip_diagnostic.py
          python scripts/v880_audit_exports.py --kind risk
          python scripts/v880_audit_exports.py --kind cash
          python scripts/v880_audit_exports.py --kind shares
          python scripts/v890_five_candidate_audit.py
          python scripts/v892_top20_quality_audit.py
          python scripts/v894_revenue_lead_discovery.py
          python scripts/v8a6_etf_rotation_watch.py
          python scripts/v8a5_quality_decision_lane.py
          python scripts/institutional_shadow.py
          python scripts/institutional_review.py
      - name: Save current results on main only (retry from fresh origin)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # Competing scheduled data writers can update snapshots while this job runs.
            # Rebuild against the newest main rather than rebasing generated artifacts.
            git fetch origin main
            git reset --hard origin/main
            python scripts/refresh_v880_public.py
            python scripts/v891_gate_certification.py --issue-only
            python scripts/tw_v880_run.py --target-date 2027-12-31
            python scripts/v881_history_diagnostic.py
            python scripts/build_universe_verification_queue.py
            python scripts/diagnose_unmodeled_universe.py
            python scripts/v881_unmodeled_blockers.py
            python scripts/v881_thin_shadow.py
            python scripts/v883_gate_orchestrator.py --top 50
            python scripts/v884_evidence_probe.py --top 50 --focus 8390 1785 5439 4739 9802 6206
            python scripts/v891_gate_certification.py
            python scripts/v886_9802_early_revalue.py
            python scripts/v888_6206_valuation.py
            python scripts/v891_6206_gate_triage.py
            python scripts/tw_chip_diagnostic.py
            python scripts/v880_audit_exports.py --kind risk
            python scripts/v880_audit_exports.py --kind cash
            python scripts/v880_audit_exports.py --kind shares
            python scripts/v890_five_candidate_audit.py
            python scripts/v892_top20_quality_audit.py
            python scripts/v894_revenue_lead_discovery.py
            python scripts/v8a6_etf_rotation_watch.py
            python scripts/v8a5_quality_decision_lane.py
            python scripts/v897_freeze_model_vintage.py --git-source-sha "$(git rev-parse HEAD)"
            python scripts/institutional_shadow.py
            python scripts/institutional_review.py
            git add tw-market-data/evidence/v880 tw-market-data/rankings tw-market-data/pit_vintages tw-market-data/experiments
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data: refresh institutional research, earnings revisions and evidence status'
            if git push origin HEAD:main; then exit 0; fi
            echo "Remote moved during generated data publication; retrying from latest data"
          done
          exit 1
