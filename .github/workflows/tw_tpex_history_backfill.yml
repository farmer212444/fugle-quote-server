name: Taiwan Official TPEx Issuer History Backfill
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tw_tpex_history_backfill.yml'
      - 'scripts/tw_tpex_history_backfill.py'
      - 'tests/test_tw_tpex_history_backfill.py'
  schedule:
    # 09:10, 12:10, 15:10, 18:10, 20:10 Asia/Taipei weekdays.
    - cron: '10 1,4,7,10,12 * * 1-5'
permissions:
  contents: write
concurrency:
  group: tw-tpex-historical-price-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test original TPEx monthly parser, code and date guards
        run: python -m unittest -v tests.test_tw_tpex_history_backfill
      - name: Fetch TPEx historical monthly data for incomplete ranked candidates
        if: github.event_name != 'pull_request'
        run: python -m scripts.tw_tpex_history_backfill --max-issuers 12 --months 3
      - name: Publish validated and source-receipted TPEx history
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python -m scripts.tw_tpex_history_backfill --max-issuers 12 --months 3
            git add tw-market-data/prices/issuer_history/TPEX/ tw-market-data/rankings/v892_tpex_backfill_progress.*
            if git diff --cached --quiet; then
              echo 'No new TPEx monthly archive source.'
              exit 0
            fi
            git commit -m 'data: archive official TPEx ranked monthly issuer turnover'
            if git push origin HEAD:main; then
              echo 'New TPEx source histories published.'
              exit 0
            fi
            echo "Remote advanced; rerun against latest main: $attempt/4"
          done
          echo '::error::TPEx source data not published after retries'
          exit 1
      - name: Preserve original TPEx HTTP source bytes for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-tpex-monthly-issuer-original-responses
          path: market-raw-tpex-history/
          retention-days: 90
          if-no-files-found: ignore
